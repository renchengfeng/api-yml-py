# 第一层 server：公共配置（独立文件）。相对路径以本文件所在目录为基准。
# 其余配置文件与它同目录：{模块}_{分组}.yaml（分组）、{模块}_{分组}_{接口}.yaml（接口）
name: "demo"

server:
  host: 127.0.0.1
  port: ${PORT:-8080}        # 支持环境变量：PORT=9000 python -m lowcode serve ...
  prefix: /api               # 所有接口统一挂在 /api 下
  timeout: 5                 # 接口默认超时（秒），分组 / 接口可覆盖
  debug: true                # 5xx 返回详细错误；节点耗时写入服务端日志，不返回给用户

# 数据源：{name, type, config}，字段结构与 datamore_lite 对齐；同名可跨类别
dataSources:
  - name: "main"
    type: sqlite
    config: {path: ../data/demo.db}
  - name: "self"
    type: http
    config: {baseUrl: "http://127.0.0.1:${PORT:-8080}", timeout: 2}
  - name: "redis1"
    type: redis
    config:
      address: dns://localhost:6379
      password: "12345678"
      timeout: "5000"
  - name: "mysql1"
    type: mysql
    config:
      sourceName: "root:12345678@tcp(localhost:3306)/datamore?charset=utf8&loc=Local&timeout=3s&readTimeout=5s"
      maxOpenConn: "100"
      maxIdleConn: "10"
      connMaxLifetime: "1800"
      showSQL: "true"
      retry: "3"
