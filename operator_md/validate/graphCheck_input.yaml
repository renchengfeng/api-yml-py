Valid:
  desc: 无环图
  config: {nodes: [{id: a}, {id: b}], edges: [{from: a, to: b}]}
  expect: {output: {ok: true, errors: [], nodeCount: 2, edgeCount: 1}}

Cycle:
  desc: 检测到环
  config: {nodes: [{id: a}, {id: b}], edges: [{from: a, to: b}, {from: b, to: a}]}
  expect: {output: {ok: false, errors: [{path: "$", message: 检测到环}], nodeCount: 2, edgeCount: 2}}
